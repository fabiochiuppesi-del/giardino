<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2F5D3A">
<title>Giardino</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2E6; --ink:#1E2A1F; --soft:#5B6B5C; --line:#CBD6BF; --card:#FFFFFF;
  --free:#2F5D3A; --danger:#C62828; --kira:#C8811A; --lulu:#6D4FA8; --unk:#7A7A6E;
  --warn-bg:#FFF3C4; --warn-ink:#5A3E00; --warn-line:#E0B400;
  --font:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#131A14; --ink:#E8EFE2; --soft:#9FB09F; --line:#2C3A2D; --card:#1B241C;
         --free:#4F9A62; --danger:#D43B3B; --kira:#E3A043; --lulu:#9C82D6; --unk:#8C8C80;
         --warn-bg:#3A2E00; --warn-ink:#FFE38A; --warn-line:#C99A00; }
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
main{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:16px;gap:12px}

/* --- connessione --- */
.conn{border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:.95rem;font-weight:600;
  background:var(--card);border:2px solid var(--line)}
.conn .dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--unk)}
.conn[data-c="on"] .dot{background:#2EA043;box-shadow:0 0 0 4px rgba(46,160,67,.25)}
.conn[data-c="connecting"] .dot{background:var(--warn-line);animation:blink 1s infinite}
.conn[data-c="off"]{background:var(--warn-bg);color:var(--warn-ink);border-color:var(--warn-line);
  flex-direction:column;align-items:stretch;padding:16px;gap:8px}
.conn[data-c="off"] .dot{display:none}
.conn .big{font-size:1.25rem;font-weight:800}
.conn .txt{font-weight:400;line-height:1.35}
.conn button{align-self:flex-start;background:var(--warn-ink);color:var(--warn-bg);padding:10px 16px;border-radius:12px;font-weight:600}
@keyframes blink{50%{opacity:.3}}

/* --- stato --- */
.stage{--c:var(--unk);flex:1;min-height:50vh;border-radius:28px;background:var(--c);color:#fff;
  padding:24px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;
  transition:background-color .5s ease, filter .3s ease}
.stage[data-s="libero"]{--c:var(--free)}
.stage[data-s="kira"],.stage[data-s="lulu"]{--c:var(--danger)}
.stage.stale[data-s="libero"],.stage.stale[data-s="unk"]{filter:saturate(.35) brightness(.9)}
.stage .stale-tag{display:none;align-self:flex-start;margin-bottom:10px;background:rgba(0,0,0,.5);padding:6px 12px;border-radius:10px;font-size:.9rem;font-weight:600}
.stage.stale .stale-tag{display:block}
.paw{position:absolute;top:-10px;right:-18px;font-size:170px;opacity:.16;line-height:1;transform:rotate(-18deg);pointer-events:none}
.stage[data-s="kira"] .paw,.stage[data-s="lulu"] .paw{display:none}

.alert{display:none;align-items:center;gap:10px;margin-bottom:auto;align-self:flex-start;
  background:#fff;color:var(--danger);font-weight:800;font-size:1.05rem;padding:8px 14px 8px 10px;border-radius:999px}
.alert svg{width:26px;height:26px;flex:none}
.stage[data-s="kira"] .alert,.stage[data-s="lulu"] .alert{display:flex}
.stage[data-s="kira"],.stage[data-s="lulu"]{
  background-image:repeating-linear-gradient(135deg,rgba(0,0,0,.10) 0 18px,transparent 18px 36px)}

.photo{display:none;width:132px;height:132px;border-radius:50%;object-fit:cover;border:5px solid #fff;
  margin:18px 0 16px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.photo.show{display:block}
.stage h1{font-size:clamp(2.3rem,10.5vw,3.5rem);font-weight:800;line-height:.98;letter-spacing:-.02em;margin:0 0 12px}
.stage p{margin:0;font-size:1.05rem;opacity:.95;line-height:1.4}

/* --- azioni --- */
.actions{display:grid;gap:10px}
button{font:inherit;cursor:pointer;border:0}
.act{padding:20px;border-radius:18px;font-size:1.2rem;font-weight:600;text-align:left;display:flex;justify-content:space-between;align-items:center;
  background:var(--card);color:var(--ink);border:2px solid var(--line)}
.act .who{width:14px;height:14px;border-radius:50%}
.act.primary{color:#fff;border-color:transparent;font-size:1.35rem;padding:24px 20px}
.act:disabled{opacity:.5;cursor:progress}
.act:focus-visible,.link:focus-visible,input:focus-visible,.conn button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

footer{color:var(--soft);font-size:.95rem}
details summary{cursor:pointer;padding:6px 0}
.set{display:grid;gap:10px;padding:10px 0 4px}
label{display:grid;gap:4px;font-size:.9rem}
input{font:inherit;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.link{background:none;color:var(--soft);text-decoration:underline;padding:0;font-size:.95rem;justify-self:start}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140px);
  background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;transition:transform .3s ease;max-width:90%}
.toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<main>
  <div class="conn" id="conn" data-c="connecting" role="status" aria-live="assertive">
    <span class="dot"></span><span id="connTxt">Connessione in corso…</span>
  </div>

  <section class="stage" id="stage" data-s="unk" aria-live="polite">
    <div class="paw" aria-hidden="true">🐾</div>
    <div class="stale-tag">Ultimo stato noto</div>
    <div class="alert"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2 1 21h22L12 2Zm0 5.5 7.5 12.5h-15L12 7.5ZM11 10v5h2v-5h-2Zm0 6v2h2v-2h-2Z"/></svg>Attenzione, giardino occupato</div>
    <img class="photo" id="photo" alt="">
    <h1 id="title">Controllo il giardino…</h1>
    <p id="sub">Un attimo.</p>
  </section>

  <div class="actions" id="actions"></div>

  <footer>
    <details>
      <summary>Impostazioni</summary>
      <div class="set">
        <label>Il tuo nome (compare nelle notifiche)
          <input id="name" autocomplete="given-name" placeholder="Es. Fabio">
        </label>
        <button class="link" id="refresh" type="button">Aggiorna lo stato adesso</button>
      </div>
    </details>
  </footer>
</main>
<div class="toast" id="toast" role="status"></div>

const DOGS = { kira: "Kira", lulu: "Lulù" };
const MAX_AGE = 12 * 3600;
let state = { s: "unk", by: "", t: 0 };
let busy = false, conn = "connecting", es = null, connTimer = null;

const $ = id => document.getElementById(id);
const nameInput = $("name");
try { nameInput.value = localStorage.getItem("giardino-nome") || ""; } catch(e) {}
nameInput.addEventListener("change", () => { try { localStorage.setItem("giardino-nome", nameInput.value.trim()); } catch(e) {} });

function myName(){
  let n = nameInput.value.trim();
  if (!n) {
    n = (prompt("Come ti chiami? (compare nelle notifiche)") || "").trim();
    if (n) { nameInput.value = n; try { localStorage.setItem("giardino-nome", n); } catch(e) {} }
  }
  return n || "Qualcuno";
}

function ago(t){
  const m = Math.round((Date.now()/1000 - t) / 60);
  if (m < 1) return "adesso";
  if (m < 60) return `da ${m} min`;
  const h = Math.floor(m/60), r = m % 60;
  return `da ${h} h${r ? " " + r + " min" : ""}`;
}

function parse(msg){
  if (!msg || msg.event !== "message") return null;
  const tags = msg.tags || [];
  const st = tags.find(x => x.startsWith("s_"));
  if (!st) return null;
  const by = decodeURIComponent((tags.find(x => x.startsWith("by_")) || "by_").slice(3));
  return { s: st.slice(2), by, t: msg.time };
}

/* ---------- connessione ---------- */
function setConn(c){
  conn = c;
  const el = $("conn");
  el.dataset.c = c;
  if (c === "on") {
    el.innerHTML = '<span class="dot"></span><span>Connesso, aggiornamento in tempo reale</span>';
  } else if (c === "connecting") {
    el.innerHTML = '<span class="dot"></span><span>Connessione in corso…</span>';
  } else {
    el.innerHTML = '<span class="big">⚠️ Non connesso</span>' +
      '<span class="txt">Lo stato qui sotto potrebbe non essere aggiornato. Verifica di persona prima di far uscire un cane.</span>' +
      '<button type="button" id="retry">Riprova a connetterti</button>';
    $("retry").onclick = reconnect;
  }
  $("stage").classList.toggle("stale", c === "off");
}

function listen(){
  if (es) es.close();
  setConn("connecting");
  clearTimeout(connTimer);
  connTimer = setTimeout(() => { if (conn === "connecting") setConn("off"); }, 8000);
  es = new EventSource(`${SERVER}/${TOPIC}/sse`);
  es.onopen = () => { clearTimeout(connTimer); setConn(navigator.onLine === false ? "off" : "on"); };
  es.onerror = () => { if (es.readyState !== EventSource.OPEN) setConn("off"); };
  es.onmessage = e => {
    try { const p = parse(JSON.parse(e.data)); if (p && p.t >= state.t) { state = p; render(); } } catch(err) {}
  };
}

function reconnect(){ poll(); listen(); }

/* ---------- stato ---------- */
function render(){
  const stale = state.t && (Date.now()/1000 - state.t) > MAX_AGE;
  const s = (!state.t || stale) ? "unk" : state.s;
  $("stage").dataset.s = s;
  document.querySelector('meta[name="theme-color"]').content =
    (s === "kira" || s === "lulu") ? "#C62828" : s === "libero" ? "#2F5D3A" : "#7A7A6E";

  const ph = $("photo");
  const src = PHOTOS[s];
  if (src) { if (ph.src !== src) ph.src = src; ph.alt = `Foto di ${DOGS[s]}`; ph.classList.add("show"); }
  else { ph.classList.remove("show"); ph.removeAttribute("src"); ph.alt = ""; }

  if (s === "libero") {
    $("title").textContent = "Il giardino è libero";
    $("sub").textContent = state.by ? `Ultimo rientro ${ago(state.t)}, segnalato da ${state.by}.` : "Puoi far uscire un cane.";
  } else if (s === "kira" || s === "lulu") {
    const other = s === "kira" ? "Lulù" : "Kira";
    $("title").textContent = `${DOGS[s]} è in giardino`;
    $("sub").textContent = `Fuori ${ago(state.t)}${state.by ? ", l'ha fatta uscire " + state.by : ""}. Tieni dentro ${other}.`;
  } else {
    $("title").textContent = "Stato sconosciuto";
    $("sub").textContent = stale
      ? "Nessun aggiornamento nelle ultime 12 ore. Controlla il giardino e imposta lo stato."
      : "Nessuna segnalazione recente. Controlla il giardino e imposta lo stato.";
  }

  const box = $("actions"); box.innerHTML = "";
  const add = (label, color, next, primary) => {
    const b = document.createElement("button");
    b.className = "act" + (primary ? " primary" : "");
    b.type = "button";
    if (primary) b.style.background = `var(--${color})`;
    const l = document.createElement("span"); l.textContent = label; b.appendChild(l);
    if (!primary) { const d = document.createElement("span"); d.className = "who"; d.style.background = `var(--${color})`; b.appendChild(d); }
    b.disabled = busy;
    b.onclick = () => change(next);
    box.appendChild(b);
  };

  if (s === "kira" || s === "lulu") {
    add(`${DOGS[s]} è rientrata`, "free", "libero", true);
    const other = s === "kira" ? "lulu" : "kira";
    add(`Scambio: rientra ${DOGS[s]}, esce ${DOGS[other]}`, other, other, false);
  } else {
    add("Esce Kira", "kira", "kira", true);
    add("Esce Lulù", "lulu", "lulu", true);
    if (s === "unk") add("Il giardino è libero", "free", "libero", false);
  }
}

async function change(next){
  const cur = $("stage").dataset.s;
  if (conn === "off" && !confirm("Non sei connesso: lo stato mostrato potrebbe essere vecchio. Vuoi provare comunque a inviare?")) return;
  if ((next === "kira" || next === "lulu") && (cur === "kira" || cur === "lulu") && cur !== next) {
    if (!confirm(`${DOGS[cur]} è già rientrata in casa?`)) return;
  }
  const by = myName();
  let title, message, priority;
  if (next === "libero") {
    const d = DOGS[cur];
    title = d ? `🏠 ${d} è rientrata` : "🏠 Giardino libero";
    message = `Il giardino è libero (${by}).`;
    priority = 3;
  } else {
    title = `⚠️ ${DOGS[next]} è in giardino`;
    message = `L'ha fatta uscire ${by}. Tieni dentro ${next === "kira" ? "Lulù" : "Kira"}!`;
    priority = 4;
  }
  const body = { topic: TOPIC, title, message, priority, tags: ["s_" + next, "by_" + encodeURIComponent(by)] };
  if (NOTIFY_EMAIL) body.email = NOTIFY_EMAIL;

  busy = true; render();
  try {
    const r = await fetch(SERVER, { method: "POST", body: JSON.stringify(body) });
    if (!r.ok) throw new Error(r.status);
    const p = parse(await r.json()); if (p) state = p;
    toast("Stato aggiornato e notifica inviata");
  } catch(e) {
    setConn("off");
    toast("Invio non riuscito: lo stato NON è cambiato. Riprova.");
  } finally { busy = false; render(); }
}

async function poll(){
  try {
    const r = await fetch(`${SERVER}/${TOPIC}/json?poll=1&since=latest`, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const lines = (await r.text()).trim().split("\n").filter(Boolean);
    for (const l of lines) { const p = parse(JSON.parse(l)); if (p && p.t >= state.t) state = p; }
    if (!lines.length) state = { s: "unk", by: "", t: 0 };
  } catch(e) { setConn("off"); }
  render();
}

let tt;
function toast(t){ const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("show"), 3000); }

$("refresh").onclick = reconnect;
window.addEventListener("offline", () => setConn("off"));
window.addEventListener("online", reconnect);
document.addEventListener("visibilitychange", () => { if (!document.hidden) reconnect(); });
setInterval(render, 30000);
render(); poll(); listen();
</script>
</body>
</html>
